version: "3.9"

services:
  # ==============================
  # .NET User Service + Postgres
  # ==============================
  gym-user-db:
    image: postgres:15
    container_name: gym-user-db
    env_file:
      - ../microservices/user-service/.env
    restart: always
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - gym-user-db-data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  gym-user-service:
    build:
      context: ../microservices
      dockerfile: user-service/Dockerfile
    container_name: gym-user-service
    env_file:
      - ../microservices/user-service/.env
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=gym-user-db;Port=5432;Database=user_service_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      BootstrapAdmin__Enabled: "true"
      BootstrapAdmin__Email: admin@gym.com
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT}
      Email__SmtpUser: ${EMAIL_SMTP_USER}
      Email__SmtpPass: ${EMAIL_SMTP_PASS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      gym-user-db:
        condition: service_healthy
    networks:
      - gym-network
    volumes:
      - ../microservices/user-service/Keys:/app/Keys
      - ../microservices/user-service/Logs:/app/Logs

  # ==============================
  # Spring Boot Membership Service + Postgres
  # ==============================
  membership-db:
    image: postgres:15
    container_name: membership-db
    environment:
      POSTGRES_DB: membership_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MEMBERSHIP_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - membership-db-data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  membership-service:
    build:
      context: ../microservices/membership-service
      dockerfile: Dockerfile
    container_name: membership-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://membership-db:5432/membership_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      membership-db:
        condition: service_healthy
    networks:
      - gym-network

      # ==============================
  # Kafka + Zookeeper
  # ==============================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - gym-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - gym-network

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - gym-network
# ==============================
# Networks and Volumes
# ==============================
networks:
  gym-network:
    driver: bridge

volumes:
  gym-user-db-data:
  membership-db-data: