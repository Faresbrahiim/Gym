
services:
  # ==============================
  # .NET User Service + Postgres
  # ==============================
  gym-user-db:
    image: postgres:15
    container_name: gym-user-db
    env_file:
      - ../microservices/user-service/.env
    restart: always
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"       # keep — for DBeaver/pgAdmin local DB access
    volumes:
      - gym-user-db-data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  gym-user-service:
    build:
      context: ../microservices
      dockerfile: user-service/Dockerfile
    container_name: gym-user-service
    env_file:
      - ../microservices/user-service/.env
    #  REMOVED ports: 5000:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=gym-user-db;Port=5432;Database=user_service_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      BootstrapAdmin__Enabled: "true"
      BootstrapAdmin__Email: admin@gym.com
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT}
      Email__SmtpUser: ${EMAIL_SMTP_USER}
      Email__SmtpPass: ${EMAIL_SMTP_PASS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PublicBaseUrl: http://localhost:8000
      PRESENCE_SERVICE_URL: http://presence-service:8080
    depends_on:
      gym-user-db:
        condition: service_healthy
      presence-service:
        condition: service_started
    networks:
      - gym-network
    volumes:
      - ../microservices/user-service/Keys:/app/Keys
      - ../microservices/user-service/Logs:/app/Logs
      - ../microservices/user-service/uploads:/app/uploads

  # ==============================
  # Spring Boot Membership Service + Postgres
  # ==============================
  membership-db:
    env_file:
      - .env
    image: postgres:15
    container_name: membership-db
    environment:
      POSTGRES_DB: membership_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MEMBERSHIP_DB_PASSWORD}
    ports:
      - "5434:5432"       
    volumes:
      - membership-db-data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  membership-service:
    env_file:
      - .env
    build:
      context: ../microservices/membership-service
      dockerfile: Dockerfile
    container_name: membership-service
    #  REMOVED ports: 8080:8080 
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://membership-db:5432/membership_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${MEMBERSHIP_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_DEV_MODE: "false"
    depends_on:
      membership-db:
        condition: service_healthy
    networks:
      - gym-network

  # ==============================
  # Symfony Cart/Shop Service + Postgres
  # ==============================
  cart-db:
    image: postgres:15
    container_name: cart-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: cart_user
      POSTGRES_PASSWORD: ${CART_DB_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart_user -d cart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  cart-service:
    build:
      context: ../microservices/cart-service/backend
      dockerfile: Dockerfile
    container_name: cart-service
    env_file:
      - .env
    environment:
      APP_ENV: dev
      APP_SECRET: ${CART_APP_SECRET}
      DATABASE_URL: postgresql://cart_user:${CART_DB_PASSWORD}@cart-db:5432/cart_db?serverVersion=15&charset=utf8
      CORS_ALLOW_ORIGIN: ^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$
    command: sh -c "php bin/console doctrine:migrations:migrate --no-interaction && php -S 0.0.0.0:80 -t public"
    depends_on:
      cart-db:
        condition: service_healthy
    networks:
      - gym-network

  # ==============================
  # Spring Boot Payment Service + Postgres
  # ==============================
  payment-db:
    image: postgres:15
    container_name: payment-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ../microservices/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    env_file:
      - .env
    # No host port mapping — public traffic goes through Kong (:8000) only.
    # Internal callers reach this service via docker DNS at payment-service:8080.
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payment
      PAYMENT_DB_USERNAME: payment_user
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MEMBERSHIP_SERVICE_URL: http://membership-service:8080
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gym-network

  # ==============================
  # Spring Boot Notification Service + Postgres
  # ==============================
  notification-db:
    image: postgres:15
    container_name: notification-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: ../microservices/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    env_file:
      - .env
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      NOTIFICATION_DB_USERNAME: postgres
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS}
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gym-network

  # ==============================
  # Kafka
  # ==============================
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    # REMOVED ports
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8085:8080"       
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - gym-network

  kong:
    image: kong:3.6
    container_name: kong
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001  # localhost only
    volumes:
      - ../microservices/api-gateway/kong:/kong
    ports:
      - "8000:8000"       # main entry point for all traffic
      - "127.0.0.1:8001:8001" # admin API — only accessible from host machine, not other containers
    networks:
      - gym-network

# ==============================
# Chat Service + MongoDB
# ==============================
  chat-db:
    image: mongo:6
    container_name: chat-db
    restart: always
    ports:
      - "27018:27017"   # optional (for local access)
    volumes:
      - chat-db-data:/data/db
    networks:
      - gym-network
  chat-service:
    build:
      context: ../microservices/chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://chat-db:27017/chatdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      PRESENCE_SERVICE_URL: http://presence-service:8080
    depends_on:
      - chat-db
      - kafka
      - presence-service
    networks:
      - gym-network

# ==============================
# Presence Service + Redis
# ==============================
  presence-redis:
    image: redis:7-alpine
    container_name: presence-redis
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  presence-service:
    build:
      context: ../microservices/presence-service
      dockerfile: Dockerfile
    container_name: presence-service
    ports:
      - "8082:8080"   # temporary — for local testing only, remove before production
    environment:
      REDIS_URL: redis://presence-redis:6379
      PRESENCE_TTL_SECS: 60
      PORT: 8080
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      RUST_LOG: info
    depends_on:
      presence-redis:
        condition: service_healthy
    networks:
      - gym-network

# ==============================
# Networks and Volumes
# ==============================
networks:
  gym-network:
    driver: bridge

volumes:
  gym-user-db-data:
  membership-db-data:
  cart-db-data:
  payment-db-data:
  notification-db-data:
  kafka-data:
  chat-db-data:
