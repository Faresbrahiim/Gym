<div class="dashboard-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="dashboard-menu">
          <ul>
            <li>
              <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <img src="assets/img/icons/dashboard-icon.svg" alt="Icon">
                <span>Dashboard</span>
              </a>
            </li>
            <li>
              <a href="javascript:void(0);">
                <img src="assets/img/icons/booking-icon.svg" alt="Icon">
                <span>My Bookings</span>
              </a>
            </li>
            <li>
              <a [routerLink]="['/chat']">
              <img src="assets/img/icons/chat-icon.svg" alt="Icon">
              <span>Chat</span>
              </a>
            </li>
            <li>
              <a routerLink="/profile" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <img src="assets/img/icons/profile-icon.svg" alt="Icon">
                <span>Profile</span>
              </a>
            </li>
            <li>
              <a routerLink="/profile/security" routerLinkActive="active">
                <img src="assets/img/icons/sessions.svg" alt="Icon">
                <span>Security</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
