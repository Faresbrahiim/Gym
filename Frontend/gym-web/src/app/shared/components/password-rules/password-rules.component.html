@if (touched && !allSatisfied) {
  <ul class="password-rules">
    <li [class.rule-met]="rules.length">At least 8 characters</li>
    <li [class.rule-met]="rules.uppercase">One uppercase letter</li>
    <li [class.rule-met]="rules.lowercase">One lowercase letter</li>
    <li [class.rule-met]="rules.number">One number</li>
    <li [class.rule-met]="rules.special">One special character</li>
  </ul>
}
