<div class="chat-shell">

  <!-- ── LEFT PANEL — conversation list ──────────────────────────────────── -->
  <aside class="chat-sidebar" [class.chat-sidebar--hidden]="mobileShowThread()">

    <div class="sidebar-header">
      <h2 class="sidebar-title">Messages</h2>
      <a routerLink="/people" class="sidebar-new-btn" title="Find people">
        <i class="feather-edit"></i>
      </a>
    </div>

    @if (loadingConversations()) {
      <div class="sidebar-loading">
        <span class="spinner-ring"></span>
      </div>
    } @else {
      <app-conversation-list
        [conversations]="conversations()"
        [activeConversationId]="activeConversation()?._id ?? null"
        [currentUserId]="currentUserId"
        (conversationSelected)="openConversation($event)"
      />
    }

  </aside>

  <!-- ── RIGHT PANEL — active thread or welcome ──────────────────────────── -->
  <main class="chat-main" [class.chat-main--visible]="mobileShowThread()">

    @if (activeConversation()) {
      <app-message-thread
        [messages]="messages()"
        [currentUserId]="currentUserId"
        [contact]="getActiveContact()"
        [isOnline]="isActiveContactOnline()"
        [typingUserIds]="typingUserIds()"
        [isLoading]="loadingMessages()"
        (backClicked)="onBackClicked()"
        class="thread-host"
      />

      <app-message-input
        (messageSent)="onMessageSent($event)"
        (typingStart)="onTypingStart()"
        (typingStop)="onTypingStop()"
      />
    } @else {
      <div class="chat-welcome">
        <div class="chat-welcome-icon">
          <i class="feather-message-circle"></i>
        </div>
        <h3 class="chat-welcome-title">Your Messages</h3>
        <p class="chat-welcome-sub">Select a conversation from the left, or find someone new to chat with.</p>
        <a routerLink="/people" class="chat-welcome-cta">
          <i class="feather-users"></i> Find People
        </a>
      </div>
    }

  </main>

</div>
