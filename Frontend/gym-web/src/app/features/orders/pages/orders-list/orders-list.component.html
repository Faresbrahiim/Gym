<section class="orders-section">
  <div class="container py-5">
    <div class="section-title text-center mb-5">
      <h2>My Orders</h2>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading()" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Orders Table -->
    <div *ngIf="!isLoading() && orders().length > 0" class="orders-table-container">
      <table class="orders-table">
        <thead>
          <tr>
            <th>Order #</th>
            <th>Date</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders()">
            <td><strong>{{ order.orderNumber }}</strong></td>
            <td>{{ order.createdAt | date:'short' }}</td>
            <td>{{ order.totalItems }} items</td>
            <td>${{ order.totalPrice.toFixed(2) }}</td>
            <td>
              <span [ngClass]="'badge ' + getStatusBadgeClass(order.status)">
                {{ order.status }}
              </span>
            </td>
            <td>
              <a [routerLink]="['/orders', order.id]" class="btn-view">
                <i class="fas fa-eye"></i> View
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading() && orders().length === 0" class="text-center py-5">
      <div class="empty-state-icon mb-3">
        <i class="fas fa-box-open"></i>
      </div>
      <p class="text-muted">No orders yet</p>
      <a routerLink="/products" class="btn btn-primary mt-3">
        <i class="fas fa-shopping-cart"></i> Start Shopping
      </a>
    </div>
  </div>
</section>
