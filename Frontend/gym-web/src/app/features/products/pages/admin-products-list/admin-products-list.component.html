<div class="admin-products-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Manage Products</h2>
    <button class="btn btn-primary" (click)="openCreateModal()">+ Add Product</button>
  </div>

  <div *ngIf="isLoading()" class="text-center py-5">
    <div class="spinner-border"></div>
  </div>
  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <div class="table-responsive" *ngIf="!isLoading()">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products(); trackBy: trackByProductId">
          <td class="align-middle">
            <img
              [src]="getImageUrl(product)"
              width="50" height="50"
              class="rounded"
              (error)="handleImageError($event)"
              [alt]="product.name">
          </td>
          <td class="align-middle">{{ product.name }}</td>
          <td class="align-middle">${{ formatPrice(product.price) }}</td>
          <td class="align-middle">
            <select
              [attr.data-product-id]="product.id"
              class="form-select form-select-sm"
              [value]="product.status"
              (change)="updateProductStatus(product, $event)"
              [disabled]="updatingStatusId === product.id">
              <option value="AVAILABLE">Available</option>
              <option value="OUT_OF_STOCK">Out of Stock</option>
              <option value="ARCHIVED">Archived</option>
            </select>
            <span *ngIf="updatingStatusId === product.id" class="ms-2 spinner-border spinner-border-sm"></span>
          </td>
          <td class="align-middle">
            <button class="btn btn-sm btn-outline-primary me-1" (click)="startEdit(product)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(product)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- CREATE MODAL -->
  <div class="modal-overlay" *ngIf="showCreateModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5>Add New Product</h5>
          <button type="button" class="btn-close" (click)="closeCreateModal()">×</button>
        </div>
        <div class="modal-body">
          <input type="text" class="form-control mb-2" placeholder="Name" [(ngModel)]="newProduct.name">
          <textarea class="form-control mb-2" placeholder="Description" [(ngModel)]="newProduct.description"></textarea>
          <input type="number" step="0.01" class="form-control mb-2" placeholder="Price" [(ngModel)]="newProduct.price">
          <select class="form-control mb-2" [(ngModel)]="newProduct.status">
            <option value="AVAILABLE">Available</option>
            <option value="OUT_OF_STOCK">Out of Stock</option>
            <option value="ARCHIVED">Archived</option>
          </select>
          <hr>
          <h6>Product Image (Optional)</h6>
          <input type="file" (change)="onFileSelected($event)" class="form-control mb-2" accept="image/*">
          <div *ngIf="selectedFile" class="alert alert-info mt-2">
            <strong>Selected:</strong> {{ selectedFile.name }} ({{ getFileSize(selectedFile.size) }})
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="closeCreateModal()">Cancel</button>
          <button class="btn btn-primary" (click)="createProduct()">Create</button>
        </div>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal-overlay" *ngIf="editingProduct">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5>Edit {{ editingProduct.name }}</h5>
          <button type="button" class="btn-close" (click)="cancelEdit()">×</button>
        </div>
        <div class="modal-body">
          <div class="text-center mb-3">
            <img
              [src]="getImageUrl(editingProduct)"
              width="100" height="100"
              class="rounded mb-2"
              (error)="handleImageError($event)"
              [alt]="editingProduct.name">
            <br>
            <small class="text-muted">Current Image</small>
          </div>
          <input type="text" class="form-control mb-2" placeholder="Name" [(ngModel)]="editForm.name">
          <textarea class="form-control mb-2" placeholder="Description" [(ngModel)]="editForm.description"></textarea>
          <input type="number" step="0.01" class="form-control mb-2" placeholder="Price" [(ngModel)]="editForm.price">
          <select class="form-control mb-2" [(ngModel)]="editForm.status">
            <option value="AVAILABLE">Available</option>
            <option value="OUT_OF_STOCK">Out of Stock</option>
            <option value="ARCHIVED">Archived</option>
          </select>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
          <button class="btn btn-primary" (click)="saveEdit()">Save Changes</button>
        </div>
      </div>
    </div>
  </div>
</div>
