spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.auto-offset-reset=earliest
membership.pending-payment-timeout-minutes=${MEMBERSHIP_PENDING_PAYMENT_TIMEOUT_MINUTES:2}

# =========================
# IMPORTANT FOR KONG
# =========================
server.forward-headers-strategy=framework
server.use-forward-headers=true

# =========================
# SPRINGDOC
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.disable-swagger-default-url=true


spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem
