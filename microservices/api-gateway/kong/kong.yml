                - Accept
              credentials: false
              max_age: 3600
              preflight_continue: false

  - name: store-admin-products-service
    url: http://cart-service:80/admin/products
    routes:
      - name: store-admin-products-route
        paths:
          - /store/admin/products
        strip_path: true
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify:
                - exp

          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              policy: local
              fault_tolerant: true
              hide_client_headers: false

          - name: cors
            config:
              origins:
                - "http://localhost:4200"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Accept
              credentials: false
              max_age: 3600
              preflight_continue: false

  - name: store-admin-orders-service
    url: http://cart-service:80/admin/orders
    routes:
      - name: store-admin-orders-route
        paths:
          - /store/admin/orders
        strip_path: true
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify:
                - exp

          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              policy: local
              fault_tolerant: true
              hide_client_headers: false

          - name: cors
            config:
              origins:
                - "http://localhost:4200"
              methods:
                - GET
                - PATCH
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Accept
              credentials: false
              max_age: 3600
              preflight_continue: false

  # --- Internal endpoint is NOT routed through Kong ---
  # /internal/payments/** is only reachable inside gym-network
  # payment-service binds it on 8080 but no Kong route exposes it publicly

  # ==============================
  # User Service
  # ==============================
  - name: user-service
    url: http://gym-user-service:8080
    routes:
      # --- Public auth endpoints  ---
      - name: user-auth-route
        paths:
          - /api/auth
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              hour: 200
              policy: local
              fault_tolerant: true
              hide_client_headers: false

          - name: cors
            config:
              origins:
                - "http://localhost:4200"
              methods:
                - GET
                - POST
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Accept
              credentials: false
              max_age: 3600
              preflight_continue: false

      # --- Protected user endpoints (JWT handled by user-service itself) ---
      - name: user-protected-route
        paths:
          - /api/users
          - /api/admin
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              policy: local
              fault_tolerant: true
              hide_client_headers: false

          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Accept
              credentials: false
              max_age: 3600
              preflight_continue: false

      # --- Internal endpoints  ---
      - name: user-internal-route
        paths:
          - /internal
        strip_path: false
        plugins:
          - name: ip-restriction
            config:
              allow:
                - 172.16.0.0/12   
                - 10.0.0.0/8
                - 192.168.0.0/16

      # --- Static file uploads ---
      - name: user-uploads-route
        paths:
          - /uploads
        strip_path: false

      # --- Swagger (no plugins) ---
      - name: user-swagger-route
        paths:
          - /api/user
        strip_path: true
  # ==============================
  # Chat Service
  # ==============================
  - name: chat-service
    url: http://chat-service:5000
    routes:
      - name: chat-rest-route
        paths:
          - /api/conversations
          - /api/messages
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify:
