_format_version: "3.0"
services:
  - name: membership-service
    url: http://membership-service:8080
    routes:
      - name: membership-route
        paths:
          - /api/subscriptions
          - /api/plans
          - /api/admin/subscriptions
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify:
                - exp

          - name: rate-limiting
            config:
              minute: 60          
              hour: 1000
              policy: local       
              fault_tolerant: true
              hide_client_headers: false

          - name: cors
            config:
              origins:
                - "*"   
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Accept
              exposed_headers:
                - X-Auth-Token
              credentials: true
              max_age: 3600
              preflight_continue: false

      - name: membership-swagger-route
        paths:
          - /api/membership
        strip_path: true

consumers:
  - username: gym-client
    jwt_secrets:
      - key: gym-auth-key-1
        algorithm: RS256
        secret: "not-used-for-rs256"
