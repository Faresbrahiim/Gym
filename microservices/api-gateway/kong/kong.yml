                - POST
                - PATCH
                - DELETE
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Accept
              credentials: false
              max_age: 3600
              preflight_continue: false

      # --- Socket.io (NO JWT — token handled by socket handshake) ---
      - name: chat-socket-route
        paths:
          - /socket.io
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              hour: 2000
              policy: local
              fault_tolerant: true
              hide_client_headers: false

          - name: cors
            config:
              origins:
                - "http://localhost:4200"
              methods:
