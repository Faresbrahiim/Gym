services:

  gym-user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-user-service
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - gym-user-db
    networks:
      - gym-network

  gym-user-db:
    image: postgres:15
    container_name: gym-user-db
    restart: always
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - gym-user-db-data:/var/lib/postgresql/data
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge

volumes:
  gym-user-db-data:
