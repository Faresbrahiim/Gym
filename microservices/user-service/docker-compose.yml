services:

  gym-user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-user-service
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=gym-user-db;Port=5432;Database=user_service_db;Username=postgres;Password=postgres
    depends_on:
      gym-user-db:
        condition: service_healthy
    networks:
      - gym-network

  gym-user-db:
    image: postgres:15
    container_name: gym-user-db
    restart: always
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - gym-user-db-data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  gym-network:
    driver: bridge

volumes:
  gym-user-db-data:
