nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['http://localhost:4200'] # Autorise votre Angular
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        max_age: 3600
    paths:
        '^/api/': ~